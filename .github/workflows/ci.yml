name: Canaan SDK CI

# When should CI run?
on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

# CI jobs
jobs:
  host-tests:
    name: Host Tests
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Download repository source
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Step 2: Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            shellcheck \
            git \
            curl \
            jq \
            zlib1g-dev

      # Step 3: Run host tests
      - name: Run host tests
        run: |
          HOST_TESTS_JOBS=2 bash test/scripts/host_tests.sh

      # Step 4: Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-reports
          path: test/results/
          if-no-files-found: ignore

  Product-build:
    name: Product build
    needs: host-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository source
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Step 2: Setup Canaan SDK
      - name: Setup Canaan SDK
        run: |
          ./build.sh setup

      # Step 3: Check disk space
      - name: Check disk space
        run: |
          df -h

      # Step 4: Free disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      # Step 5: Check disk space after cleanup
      - name: Check disk space after cleanup
        run: |
          df -h

      # Step 3: Build for product
      - name: Build Product
        run: |
          ./build.sh nano3s
